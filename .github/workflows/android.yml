name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle Ruffle runtime
        run: |
          bash tools/bundle-ruffle.sh
          test -s app/src/main/assets/player/ruffle/ruffle.js
          find app/src/main/assets/player/ruffle -name '*.wasm' | grep -q .
      - name: Check playback controls and live fast forward
        run: |
          node --test tools/test-player.cjs
          npm install --prefix "$RUNNER_TEMP/swf-smoke" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/swf-smoke/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/swf-smoke/node_modules" node tools/smoke-speed.cjs
      - name: Build debug APK and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload APK and runtime version
        uses: actions/upload-artifact@v4
        with:
          name: SWFlash-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            RUFFLE_VERSION.txt
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
