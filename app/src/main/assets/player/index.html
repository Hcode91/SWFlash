<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SWF Pocket</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101821;color:#e6edf3}*{box-sizing:border-box}body{margin:0;padding:16px;min-height:100dvh;display:flex;flex-direction:column;gap:14px}header{display:flex;align-items:center;gap:12px}h1{font-size:21px;margin:0}header span{font-size:12px;color:#8de0c5;margin-left:auto}button{font:inherit;color:inherit;background:#233343;border:1px solid #3b5163;border-radius:12px;padding:12px;touch-action:none}button:active{background:#3d7269}.primary{background:#89e2c1;color:#102820;border:0;font-weight:700}nav{display:flex;flex-wrap:wrap;gap:8px}#stage{min-height:240px;flex:1;display:flex;align-items:center;justify-content:center;background:#070d13;border:1px solid #2c3a47;border-radius:16px;overflow:hidden;position:relative}ruffle-player{width:100%;height:100%;min-height:360px}#empty{padding:28px;text-align:center;color:#9daebf;line-height:1.6}#name{overflow-wrap:anywhere;font-weight:600}#status,footer{font-size:13px;color:#9daebf;line-height:1.5}#controls{display:flex;justify-content:space-between;gap:14px}#controls[hidden]{display:none}.pad{display:grid;grid-template-columns:repeat(3,48px);gap:5px}.pad button{padding:12px 0}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#stage:fullscreen{border:0;border-radius:0;height:100vh}#stage:fullscreen ruffle-player{height:100vh}

#screen{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
#fullscreen-tools{display:none}
#screen:fullscreen{position:relative;width:100%;height:100%;padding:0;background:#070d13;gap:0}
#screen:fullscreen #stage{height:100%;min-height:0;border:0;border-radius:0}
#screen:fullscreen ruffle-player{height:100%;min-height:0}
#screen:fullscreen #fullscreen-tools{display:flex;position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));gap:8px;z-index:10;flex-wrap:wrap;max-width:calc(100% - 24px);justify-content:flex-end}
#screen:fullscreen #controls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));z-index:10;pointer-events:none}
#screen:fullscreen #controls button{pointer-events:auto;background:#233343e6}
</style></head><body><header><h1>SWF Pocket</h1><span>OFFLINE PLAYER</span></header><nav><button class="primary" id="open">Open SWF</button><button id="pause">Pause</button><button id="restart">Restart</button><button id="speed" aria-label="Playback speed 1 times. Tap to change.">Speed: 1×</button><button id="full">Fullscreen</button><button id="toggle" aria-pressed="false">Game controls</button></nav><div id="name">Your Flash collection, on Android</div><div id="screen"><div id="fullscreen-tools"><button id="fullscreen-speed" aria-label="Playback speed 1 times. Tap to change.">Speed: 1×</button><button id="fullscreen-toggle" aria-pressed="false">Show controls</button><button id="fullscreen-exit">Exit fullscreen</button></div><div id="stage"><div id="empty">Open a local .swf animation or game.<br>Your files stay on your device.</div></div><div id="controls" hidden><div class="pad"><span></span><button data-key="ArrowUp" aria-label="Up">↑</button><span></span><button data-key="ArrowLeft" aria-label="Left">←</button><button data-key="ArrowDown" aria-label="Down">↓</button><button data-key="ArrowRight" aria-label="Right">→</button></div><div class="actions"><button data-key="Space">Space</button><button data-key="Enter">Enter</button><button data-key="KeyZ">Z</button><button data-key="KeyX">X</button></div></div></div><div id="status" role="status">Ready to open a file.</div><footer>Powered by Ruffle. Compatibility varies by movie. Files needing external assets or online services may not work.</footer>
<script>window.RufflePlayer={config:{autoplay:'off',backgroundColor:'#070d13',letterbox:'on',allowScriptAccess:false,openUrlMode:'deny',allowNetworking:'none',warnOnUnsupportedContent:true}};</script><script src="speed-clock.js"></script><script src="ruffle/ruffle.js"></script><script src="app.js"></script></body></html>
